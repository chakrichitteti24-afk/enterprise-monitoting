<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#18223d" />
    </linearGradient>

    <!-- Outer Glow and Highlights -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Core Radiant Gradients -->
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="neonIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Radial Glow Behind Core -->
    <radialGradient id="radialCoreGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#4f46e5" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" filter="url(#cardShadow)" />

  <!-- Ambient Internal Grid and Energy Waves -->
  <g opacity="0.15">
    <circle cx="256" cy="256" r="180" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="256" cy="256" r="130" fill="none" stroke="#818cf8" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="256" y1="40" x2="256" y2="472" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" />
    <line x1="40" y1="256" x2="472" y2="256" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 8" />
  </g>

  <!-- Deep Atmospheric Radial Core Glow -->
  <circle cx="256" cy="240" r="160" fill="url(#radialCoreGlow)" />

  <!-- Geometric Diamond Shield Base Structure -->
  <g filter="url(#subtleGlow)">
    <!-- Isometric Outer Hexagonal Armor -->
    <path d="M256 92 L388 168 V320 L256 396 L124 320 V168 Z" 
          fill="none" 
          stroke="url(#neonBlue)" 
          stroke-width="7" 
          stroke-linejoin="round" 
          stroke-linecap="round" 
          opacity="0.75" />

    <!-- Inner Secondary Facet -->
    <path d="M256 128 L354 186 V300 L256 358 L158 300 V186 Z" 
          fill="none" 
          stroke="url(#neonIndigo)" 
          stroke-width="3" 
          stroke-linejoin="round" 
          opacity="0.4" />
  </g>

  <!-- Algorithm Graph and Binary Tree Network Lines -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Tree Root to Child Branches -->
    <line x1="256" y1="156" x2="192" y2="224" stroke="url(#neonBlue)" stroke-width="6" filter="url(#subtleGlow)" />
    <line x1="256" y1="156" x2="320" y2="224" stroke="url(#neonBlue)" stroke-width="6" filter="url(#subtleGlow)" />
    
    <!-- Child Branches to Leaf Nodes -->
    <line x1="192" y1="224" x2="160" y2="308" stroke="url(#neonBlue)" stroke-width="5" />
    <line x1="192" y1="224" x2="228" y2="308" stroke="url(#neonBlue)" stroke-width="5" />
    <line x1="320" y1="224" x2="284" y2="308" stroke="url(#neonBlue)" stroke-width="5" />
    <line x1="320" y1="224" x2="352" y2="308" stroke="url(#neonBlue)" stroke-width="5" />

    <!-- Cross-mesh Interconnects -->
    <line x1="228" y1="308" x2="284" y2="308" stroke="url(#neonIndigo)" stroke-width="3.5" stroke-dasharray="4 4" />
  </g>

  <!-- Central Dynamic Prism Monogram: GKCE Iconic Crest -->
  <g filter="url(#glowFilter)">
    <!-- Left Angular Bracket / G-Form Crest -->
    <path d="M208 172 L164 216 L208 260 H240 V232 H212 L196 216 L212 200 H252 V172 Z" 
          fill="url(#neonBlue)" />

    <!-- Right Angular Bracket / K-Form Vertex Core -->
    <path d="M272 172 V260 H300 V224 L328 260 H364 L322 212 L360 172 H324 L298 202 V172 Z" 
          fill="url(#neonIndigo)" />
  </g>

  <!-- DSA Pulse Graph Nodes (Luminous Circles) -->
  <g filter="url(#glowFilter)">
    <!-- Root Node (Top Alpha) -->
    <circle cx="256" cy="156" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="3" />
    <circle cx="256" cy="156" r="6" fill="#ffffff" />

    <!-- Intermediate Nodes (Level 1) -->
    <circle cx="192" cy="224" r="11" fill="#2563eb" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="192" cy="224" r="4" fill="#ffffff" />

    <circle cx="320" cy="224" r="11" fill="#6366f1" stroke="#818cf8" stroke-width="2.5" />
    <circle cx="320" cy="224" r="4" fill="#ffffff" />

    <!-- Leaf Nodes (Level 2) -->
    <circle cx="160" cy="308" r="8" fill="#0284c7" stroke="#7dd3fc" stroke-width="2" />
    <circle cx="228" cy="308" r="8" fill="#4f46e5" stroke="#a5b4fc" stroke-width="2" />
    <circle cx="284" cy="308" r="8" fill="#7c3aed" stroke="#c084fc" stroke-width="2" />
    <circle cx="352" cy="308" r="8" fill="#0284c7" stroke="#7dd3fc" stroke-width="2" />
  </g>

  <!-- Speed and Mastery Binary Spark / Benchmark Star at Crown -->
  <polygon points="256,76 261,90 275,95 261,100 256,114 251,100 237,95 251,90" 
           fill="url(#goldAccent)" 
           filter="url(#subtleGlow)" />

  <!-- Bottom Tech Badge Pill: GKCE DSA -->
  <g transform="translate(196, 424)">
    <rect width="120" height="28" rx="14" fill="#0b1329" stroke="url(#borderGrad)" stroke-width="1.5" />
    <text x="60" y="18" font-family="'JetBrains Mono', monospace, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">GKCE • DSA</text>
  </g>
</svg>